# Cloud Build configuration for Bolo Debate Backend
# Deploys to Google Cloud Run

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bolo-debate-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bolo-debate-api:latest'
      - '-f'
      - 'Dockerfile.production'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bolo-debate-api:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bolo-debate-api:latest']

  # Run database migrations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'migrate-db'
      - '--region'
      - 'asia-south1'
      - '--wait'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bolo-debate-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bolo-debate-api:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=8080,HOST=0.0.0.0'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,LIVEKIT_URL=LIVEKIT_URL:latest,GROQ_API_KEY=GROQ_API_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/bolo-debate-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/bolo-debate-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'

substitutions:
  _REGION: asia-south1
