# Render Blueprint - Deploy with one click
# https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: bolo-debate-api
    runtime: node
    region: singapore  # Closest to India
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bolo-debate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bolo-debate-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LIVEKIT_API_KEY
        sync: false  # Set manually after Fly.io setup
      - key: LIVEKIT_API_SECRET
        sync: false  # Set manually after Fly.io setup
      - key: LIVEKIT_URL
        sync: false  # Set manually after Fly.io setup
      - key: OPENAI_API_KEY
        sync: false  # Set manually
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0

  # Redis for caching and pub/sub
  - type: redis
    name: bolo-debate-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  # PostgreSQL Database
  - name: bolo-debate-db
    region: singapore
    plan: free
    databaseName: bolo_debate
    user: bolo_user
