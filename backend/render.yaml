# Render Blueprint - Deploy with one click
# https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: bolo-debate-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manually - use Neon or Supabase free PostgreSQL
      - key: REDIS_URL
        value: memory  # Use in-memory store (no Redis needed)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false  # FREE - get at https://console.groq.com/keys
      - key: OPENAI_API_KEY
        sync: false  # Optional - only if Groq unavailable
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
